<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScratchJr 创作 · TeachingOpen</title>
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="persistence.css">
<script src="../js/jquery.min.js"></script>
<script src="../js/jquery.cokie.min.js"></script>
<script src="../js/qiniu.min.js"></script>
<script src="../js/common.js?v=28"></script>
<script src="../scratch3/persistence.js"></script>
<script defer src="editor-bridge.js"></script>
</head>
<body>
<header class="creation-header">
  <a href="/index" class="brand">TeachingOpen<span>创作空间 / ScratchJr</span></a>
  <div class="title-field"><label for="project-name">作品名称</label><input id="project-name" maxlength="64" autocomplete="off" disabled></div>
  <div class="actions"><button id="save-draft" disabled>保存草稿</button><button id="submit-work" class="primary" disabled>提交作业</button></div>
</header>
<div class="status-row"><p id="persistence-status" role="status" aria-live="polite">正在打开作品…</p><button id="retry-load" hidden>重新打开</button></div>
<p class="workspace-notice">积木编辑区适合横屏或电脑操作。小屏幕可在下方区域横向滚动。</p>
<main id="workspace" aria-label="ScratchJr 积木编辑区" tabindex="0"><div id="engine-host"></div></main>
</body>
</html>
