<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" value="notranslate">
  <link rel="shortcut icon" href="static/favicon.ico" />
  <link rel="stylesheet" href="persistence.css" />
  <title>在线图形化编程</title>
  <script src="../js/jquery.min.js"></script>
  <script src="../js/jquery.cokie.min.js"></script>
  <script src="../js/qiniu.min.js"></script>
  <script src="../js/common.js?v=28"></script>
  <script src="persistence.js"></script>
  <script src="editor-bridge.js"></script>
  <script>
    var userInfo = {}
    var userToken = ''
    try { userInfo = getUserInfo() || {}; userToken = getUserToken() || '' } catch (error) {}
    window.scratchConfig = {
      session: {
        token: userToken,
        username: userInfo.realname || userInfo.username || '',
        //avatar: getQiniuUrl(userInfo.avatar) || './static/avatar.png',
      },
      backpack:{
        enable: true,
        api: "/api/teaching/scratch/backpack",
      },
      cloudData:{
        enable: true,
        id: "create", //云变量ID，提交作业后使用window.scratch.setCloudId换成作品ID
        api: window.location.hostname +"/api/websocket/scratch/cloudData" //云变量API地址
      },
      projectInfo: {//作品信息
        projectName: "",
        authorUsername: userInfo.username || '', //默认为自己的用户名
        authorAvatar: './static/avatar.png',
      },
      logo: {
        show: true, 
        url: './static/favicon.ico',
        handleClickLogo: () => {
          window.open("/")
        }
      }, 
      stageArea: {
        fullscreenButton:{ //全屏按钮
          show: true,
          handleBeforeSetStageUnFull(){ //退出全屏前的操作
            return true
          },
          handleBeforeSetStageFull(){ //全屏前的操作
            return true
          }
        },
        startButton:{ //开始按钮
          show: true,
          handleBeforeStart(){ //开始前的操作
            return true
          }
        },
        stopButton:{ // 停止按钮
          show: true,
          handleBeforeStop(){ //停止前的操作
            return true
          }
        }
      },
      menuBar: {
        //菜单栏样式
        style: {
          background: '#334e43',
        },
        //切换语言按钮
        languageButton:{
          show: false, //是否显示
          defaultLanguage: 'zh-cn' //默认语言 en zh-cn zh-tw
        },
        //新建按钮
        newButton:{
          show: true,
          handleBefore(){
            return true
          }
        },
        //从计算机加载按钮
        loadFileButton:{
          show: true,
          handleBefore(){
            return true
          }
        },
        //保存到计算机按钮
        saveFileButton:{
          show: true,
          handleBefore(){
            return true
          }
        },
        //加速模式按钮
        turboModeButton:{
          show: true
        },
        //教程按钮
        helpButton:{
          show: true,
          handleBefore: ()=>{return true}
        },
         //我的物品按钮
         myStuff:{
          show: true,
          url: '/account/center'
        },
        //用户头像按钮
        userAvatar:{
          show: true,
          username: (userInfo && userInfo.realname) || '未登录',
          avatar: (userInfo && getFileAccessHttpUrl(userInfo.avatar)) || './static/avatar.png',
          handleClick(){
            //弹出登录框等操作
            console.log("点击头像")
            window.open("/account/settings/BaseSetting")
          }
        },
        customButtons: [],
      },
      blocks:{
        scale: 0.8, // 积木缩放比例
        // 隐藏分类
        hideCatagorys:[], 
        hideBlocks:[],
      },
      handleVmInitialized: window.TeachingScratch.initialize,
      handleDefaultProjectLoaded: window.TeachingScratch.start,
      //默认项目地址
      defaultProjectURL: "./static/project.sb3",
      //素材库配置
      assets:{
        //素材库地址
        // assetHost: getSysConfig('qiniuDomain'), //使用七牛云的素材库,如果需要使用系统的自定义素材库，必须使用七牛云存储
        assetHost: './static',
        //素材库索引地址
        defaultIndex:{
          sprites: "./static/json_index/sprites.json",
          costumes: "./static/json_index/costumes.json",
          backdrops: "./static/json_index/backdrops.json",
          sounds: "./static/json_index/sounds.json"
        },
        //拦截角色库打开
        handleBeforeSpriteLibraryOpen(){
          console.log("角色库打开")
          //追加素材库
          window.getScratchAssets(4,data=>{
            window.scratch.pushSpriteLibrary(data)
          })
          return true;
        },
        //拦截造型库打开
        handleBeforeCostumesLibraryOpen(){
          window.getScratchAssets(3,data=>{
            window.scratch.pushCostumesLibrary(data)
          })
          return true;
        },
        //拦截背景库打开
        handleBeforeBackdropsLibraryOpen(){
          window.getScratchAssets(1,data=>{
            window.scratch.pushBackdropsLibrary(data)
          })
          return true;
        },
        //拦截声音库打开
        handleBeforeSoundLibraryOpen(){
          window.getScratchAssets(2,data=>{
            window.scratch.pushSoundsLibrary(data)
          })
          return true;
        }
      }
    }
  </script>
</head>
<body>
  <header class="editor-header">
    <div class="editor-heading">
      <h1>Scratch · 图形化创作</h1>
      <p id="persistence-status" role="status" aria-live="polite">正在启动编辑器…</p>
    </div>
    <nav class="editor-actions" aria-label="作品操作">
      <button id="retry-load" type="button" hidden>重新打开</button>
      <button id="save-draft" type="button" disabled>保存草稿</button>
      <button id="submit-work" type="button" class="primary" disabled>提交作业</button>
    </nav>
  </header>
  <p class="editor-note">图形化编辑建议使用宽屏；当前可横向滚动工作区。保存和提交始终位于顶部。</p>
  <main class="editor-viewport" aria-label="Scratch 编辑工作区">
    <div id="scratch" inert aria-busy="true"></div>
    <div id="editor-unavailable" aria-hidden="true"></div>
  </main>
  <script src="lib.min.js"></script>
  <script src="chunks/gui.js"></script>
</body>
</html>
