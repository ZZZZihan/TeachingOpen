<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" value="notranslate">
  <link rel="shortcut icon" href="static/favicon.ico">
  <title>Scratch 3.0 Player</title>
  <style>html, body { margin: 0; } #scratch { width: 100%; } .cloud-status-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; padding: 5px 8px; background: rgba(255,255,255,.96); color: #53645e; font: 12px/1.5 sans-serif; } .cloud-status-bar button { margin-left: 8px; color: #225e48; background: #fff; border: 1px solid #cad6d0; border-radius: 4px; cursor: pointer; } [hidden] { display: none !important; }</style>
  <script src="../js/jquery.min.js"></script>
  <script src="../js/common.js?v=28"></script>
  <script src="cloud-client.js"></script>
  <script src="player-bridge.js"></script>
  <script>
    window.scratchConfig = {
      cloudData:{
        enable: true,
        managed: true,
        id: ""
      },
      projectInfo: {//作品信息
        authorUsername: "",
        authorAvatar: './static/avatar.png',
      },
      stageArea: {
        scale: window.innerWidth / 480, //自适应屏幕大小
        width: 480,
        height: 360,
        showControl: true,
        showLoading: false,
        fullscreenButton:{ //全屏按钮
          show: true,
          handleBeforeSetStageUnFull(){ //退出全屏前的操作
            var event = new CustomEvent('scratchUnFullScreen');
            window.parent.document.dispatchEvent(event);
            return true
          },
          handleBeforeSetStageFull(){ //全屏前的操作
            var event = new CustomEvent('scratchFullScreen');
            window.parent.document.dispatchEvent(event);
            setTimeout(()=>{
              window.scratch.setFullScreen(true)
            },100)
            return false
          }
        },
        startButton:{ //开始按钮
          show: true,
          handleBeforeStart(){ //开始前的操作
            return true
          }
        },
        stopButton:{ // 停止按钮
          show: true,
          handleBeforeStop(){ //停止前的操作
            return true
          }
        }
      },
      handleVmInitialized: window.TeachingScratchPlayer.initialize,
      handleDefaultProjectLoaded: window.TeachingScratchPlayer.start
    }
  </script>
</head>

<body>
  <aside id="cloud-status-bar" class="cloud-status-bar" aria-label="云变量状态"><span id="player-status" role="status" aria-live="polite">正在打开作品…</span><button id="retry-project" type="button" hidden>重新打开</button><span id="cloud-status" role="status" aria-live="polite">案例变量在本机运行。</span><button id="retry-cloud" type="button" hidden>重连云变量</button></aside>
  <div id="scratch">
  </div>
</body>

<script type="text/javascript" src="lib.min.js"></script>
<script type="text/javascript" src="chunks/player.js"></script>
<script src="player-layout.js?v=1"></script>

</html>
