name: TeachingOpen CI

on:
  pull_request:
  push:
    branches: [main, codex/registration-acceptance]

permissions:
  contents: read

concurrency:
  group: teachingopen-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected PR jobs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      # Only canonical, strictly validated strings can authorize a skip.
      selective: ${{ steps.validated.outputs.selective }}
      frontend: ${{ steps.validated.outputs.frontend }}
      backend: ${{ steps.validated.outputs.backend }}
      tools: ${{ steps.validated.outputs.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the verified PR merge candidate
        id: plan
        run: python3 ci/select_jobs.py
      - name: Normalize missing or malformed plans to the full suite
        id: validated
        if: ${{ !cancelled() }}
        env:
          CI_PLAN_JSON: ${{ toJSON(steps.plan) }}
        run: python3 ci/check_required_jobs.py --normalize

  reuse:
    name: Verify identical-tree PR evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.validated.outputs.reuse }}
      source_run_id: ${{ steps.validated.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reuse only complete fresh PR evidence for this exact tree
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/ci_reuse.py
      - name: Normalize absent or malformed reuse decisions to full checks
        id: validated
        if: ${{ !cancelled() }}
        env:
          CI_REUSE_STEP: ${{ toJSON(steps.proof) }}
        run: python3 ci/ci_reuse.py --normalize

  # Always rerun frontend on pushes: live npm advisories and exception expiry
  # are time-dependent even when the source tree and runner image match.
  frontend:
    name: Frontend tests and build
    needs: [changes, reuse]
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.result != 'success' || needs.changes.outputs.selective != 'true' ||
          needs.changes.outputs.frontend != 'false') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Existing regression tests compare against reviewed historical commits.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: |
          npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend tests
        working-directory: web
        run: npm test
      - name: Render announcement security regression in Chromium
        working-directory: web
        run: node tests/announcement-rendering.browser.cjs
      - name: Verify upload credentials against synthetic loopback destinations
        working-directory: web
        run: node tests/upload-credentials.browser.cjs
      - name: Verify actual Header and TMenu navigation in Chromium
        working-directory: web
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          test ! -e "$GITHUB_WORKSPACE/ci-results/teaching-menu-browser"
          node tests/teaching-menu-browser.cjs --ref "$GITHUB_SHA" --output "$GITHUB_WORKSPACE/ci-results/teaching-menu-browser"
          python3 ../ci/check_menu_browser_results.py --sha "$GITHUB_SHA"
      - name: Production build
        working-directory: web
        env:
          NODE_OPTIONS: --openssl-legacy-provider --max-old-space-size=4096
          TEACHING_DEPENDENCY_REPORT: '1'
        run: npm run build
      - name: Browser runtime dependency release gate
        run: python3 ci/check_richtext_dependencies.py
      - name: Initial JS and CSS budget
        working-directory: web
        run: npm run check:initial-assets
      - name: Store synthetic menu browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teaching-menu-browser-ci-results
          path: |
            ci-results/teaching-menu-browser/*.json
            ci-results/teaching-menu-browser/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Record original successful frontend execution
        if: success() && github.event_name == 'pull_request'
        run: python3 ci/ci_reuse.py --record frontend
      - name: Store original frontend execution receipt
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-fresh-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/reuse/frontend/receipt.json
          if-no-files-found: ignore
          retention-days: 2

  tools:
    name: Backup and migration tools
    needs: [changes, reuse]
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.result != 'success' || needs.changes.outputs.selective != 'true' ||
          needs.changes.outputs.tools != 'false') &&
          (needs.reuse.result != 'success' || needs.reuse.outputs.reuse != 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8.0.504+1'
      - name: Candidate bundle filesystem contracts (real JDK 8, synthetic artifacts)
        run: python3 -m unittest discover -s deploy -p 'test_candidate_release.py' -v
      - name: Synthetic backup and migration tests (no backup execution)
        run: |
          python3 -m unittest discover -s deploy -p 'test_*backup*.py' -v
          PYTHONPATH=deploy python3 -m unittest test_registration_upgrade.MigrationManifestTests -v
          python3 -m unittest discover -s deploy -p 'test_launch_bundle.py' -v
          python3 -m unittest discover -s deploy -p 'test_probe_candidate_runtime.py' -v
          python3 -m unittest discover -s deploy -p 'test_ip_https.py' -v
          python3 -m unittest discover -s deploy -p 'test_check_ip_certificate.py' -v
          python3 -m unittest discover -s deploy -p 'test_renew_ip_certificate.py' -v
          python3 -m unittest discover -s deploy -p 'test_monitor_ip_https.py' -v
          python3 -m unittest discover -s deploy -p 'test_traffic_control.py' -v
          python3 -m unittest discover -s api/dev -p 'test_extract_schema.py' -v
          python3 -m unittest discover -s api/dev -p 'test_local_media_index_probe.py' -v
          python3 -m unittest discover -s ci -p 'test_*.py' -v
      - name: Teaching journey fixture offline boundaries (no services)
        run: python3 -m unittest discover -s api/dev -p 'test_teaching_journey_fixture.py' -v
      - name: Isolated IP HTTPS and rollback (synthetic CA, loopback only)
        run: |
          docker pull nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
          python3 deploy/test_ip_https_runtime.py --output ci-results/ip-https-runtime.json
      - name: Store synthetic HTTPS verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ip-https-ci-results
          path: ci-results/ip-https-runtime.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Record original successful tools execution
        if: success() && github.event_name == 'pull_request'
        run: python3 ci/ci_reuse.py --record tools
      - name: Store original tools execution receipt
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-fresh-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/reuse/tools/receipt.json
          if-no-files-found: ignore
          retention-days: 2

  backend:
    name: Backend and MySQL registration
    needs: [changes, reuse]
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.result != 'success' || needs.changes.outputs.selective != 'true' ||
          needs.changes.outputs.backend != 'false') &&
          (needs.reuse.result != 'success' || needs.reuse.outputs.reuse != 'true') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: ci-ephemeral-mysql
          MYSQL_ROOT_HOST: '%'
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis@sha256:46f15cf64fdef63e483dcda99e74e3d51c017b1175547b6bb874152ee2391aad
        ports:
          - 36379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '8.0.504+1'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - name: Install test clients
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mysql-client redis-tools
      - name: Backend build and core unit tests (explicitly enabled)
        working-directory: api
        run: >-
          mvn -B -ntp -s dev/maven-settings.xml
          -DskipTests=false
          -Dtest="$(python3 ../ci/check_java_results.py --list)"
          -Dsurefire.failIfNoSpecifiedTests=false
          clean package
      - name: Require executed core tests
        run: python3 ci/check_java_results.py
      - name: Verify trusted proxy configuration and media cookie flags
        run: python3 deploy/test_ip_https_proxy.py --java-home "$JAVA_HOME" --m2 "$HOME/.m2/repository"
      - name: Fresh MySQL migrations and registration HTTP/SQL checks
        env:
          CI_MYSQL_ROOT_PASSWORD: ci-ephemeral-mysql
        run: python3 ci/registration_mysql.py
      - name: Store synthetic verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registration-ci-results
          path: ci-results/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Record original successful backend execution
        if: success() && github.event_name == 'pull_request'
        env:
          CI_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          CI_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: python3 ci/ci_reuse.py --record backend
      - name: Store original backend execution receipt
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-fresh-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/reuse/backend/receipt.json
          if-no-files-found: ignore
          retention-days: 2

  required:
    name: CI required
    if: always()
    needs: [changes, reuse, frontend, tools, backend]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful checks and only explicitly planned skips
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 ci/check_required_jobs.py
