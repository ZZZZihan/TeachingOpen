name: TeachingOpen CI

on:
  pull_request:
  push:
    branches: [main, codex/registration-acceptance]

permissions:
  contents: read

concurrency:
  group: teachingopen-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: |
          npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend tests
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        env:
          NODE_OPTIONS: --openssl-legacy-provider --max-old-space-size=4096
        run: npm run build

  tools:
    name: Backup and migration tools
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Synthetic backup and migration tests (no backup execution)
        run: |
          python3 -m unittest discover -s deploy -p 'test_*backup*.py' -v
          PYTHONPATH=deploy python3 -m unittest test_registration_upgrade.MigrationManifestTests -v
          python3 -m unittest discover -s deploy -p 'test_launch_bundle.py' -v
          python3 -m unittest discover -s api/dev -p 'test_extract_schema.py' -v
          python3 -m unittest discover -s ci -p 'test_*.py' -v

  backend:
    name: Backend and MySQL registration
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-ephemeral-mysql
          MYSQL_ROOT_HOST: '%'
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.2
        ports:
          - 36379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test clients
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mysql-client redis-tools
      - name: Backend build and core unit tests (explicitly enabled)
        working-directory: api
        run: >-
          mvn -B -ntp -s dev/maven-settings.xml
          -DskipTests=false
          -Dtest=AccountRegistrationServiceTest,AccountRecoveryServiceTest,AccountRecoverySessionTest,PublicUserDirectoryTest
          -Dsurefire.failIfNoSpecifiedTests=false
          clean package
      - name: Require executed core tests
        run: python3 ci/check_java_results.py
      - name: Fresh MySQL migrations and registration HTTP/SQL checks
        env:
          CI_MYSQL_ROOT_PASSWORD: ci-ephemeral-mysql
        run: python3 ci/registration_mysql.py
      - name: Store synthetic verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registration-ci-results
          path: ci-results/*.json
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [frontend, tools, backend]
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          FRONTEND: ${{ needs.frontend.result }}
          TOOLS: ${{ needs.tools.result }}
          BACKEND: ${{ needs.backend.result }}
        run: test "$FRONTEND" = success && test "$TOOLS" = success && test "$BACKEND" = success
